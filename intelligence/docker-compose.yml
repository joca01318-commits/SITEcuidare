# Sobe o sistema e (opcionalmente) um modelo de IA local gratuito com Ollama.
#   docker compose up -d
#   docker compose exec app npm run invite -- --admin
services:
  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data

  # Descomente para usar IA local (precisa de ~8 GB de RAM livres).
  # Depois: docker compose exec ollama ollama pull qwen2.5:7b
  # e no .env: AI_MODE=hybrid  AI_BASE_URL=http://ollama:11434/v1  AI_MODEL=qwen2.5:7b  AI_PROVIDER_LOCAL=true
